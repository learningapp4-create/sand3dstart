<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sand</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font: 16px/1.45 "Segoe UI", sans-serif;
  color: #17301c;
  background: #d5e4c8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
main { width: min(820px, 100%); }
h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; }
p.lead { margin: 0 0 22px; color: #3d5344; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
a.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: #f7f4ea;
  border-radius: 16px;
  padding: 22px 20px 18px;
  border: 1px solid #e4dcc6;
  min-height: 180px;
}
a.card:hover { border-color: #c45c3e; }
.kicker {
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #8a5a32;
  margin: 0 0 8px;
}
h2 { margin: 0 0 8px; font-size: 22px; }
p { margin: 0; color: #3d5344; }
.go { display: inline-block; margin-top: 16px; color: #9a3b28; font-weight: 650; }
@media (max-width: 680px) {
  .choices { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <h1>Sand</h1>
  <p class="lead">Choose a scene.</p>
  <div class="choices">
    <a class="card" href="newscene.html">
      <p class="kicker">Library</p>
      <h2>Object library</h2>
      <p>Browse the Sand3D catalogue by category and place a piece on the green grid.</p>
      <span class="go">Open the library</span>
    </a>
    <a class="card" href="town.html">
      <p class="kicker">Blender</p>
      <h2>Low-poly town</h2>
      <p>Walk around the high street, the cross street, and the shop awnings built in Blender.</p>
      <span class="go">Open the town</span>
    </a>
  </div>
</main>
</body>
</html>
