<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene</title>
<style>
:root {
  --panel: #1b221c;
  --line: #2c382e;
  --txt: #e7eee4;
  --dim: #9aab9c;
  --acc: #d6e38a;
  --chip: #2a3828;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  background: #c5ced6;
  color: var(--txt);
  font: 14px/1.45 "Segoe UI", sans-serif;
  overflow: hidden;
}
.view { flex: 1; position: relative; min-width: 0; }
.view canvas { display: block; width: 100%; height: 100%; }
#hud {
  position: absolute; left: 16px; bottom: 16px;
  background: rgba(255,255,255,0.88);
  color: #17301c;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  pointer-events: none;
  max-width: min(460px, 70%);
}
aside {
  width: min(380px, 36vw);
  min-width: 280px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.panel-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
.panel-head h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.panel-head p { margin: 0; color: var(--dim); font-size: 12.5px; }
.filters { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--dim); letter-spacing: 0.04em; text-transform: uppercase; }
select, input[type="search"] {
  background: #121814; color: var(--txt); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px;
  text-transform: none; letter-spacing: 0;
}
.list-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 16px; color: var(--dim); font-size: 12px;
}
.list { flex: 1; overflow: auto; padding: 0 10px 12px; }
.row {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 10px;
  align-items: center;
  padding: 8px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
}
.row:hover { background: rgba(255,255,255,0.03); }
.row.selected { border-color: var(--acc); background: rgba(214, 227, 138, 0.08); }
.row img { width: 64px; height: 64px; object-fit: contain; background: #f4f4f2; border-radius: 8px; }
.row .name { font-size: 12.5px; word-break: break-all; }
.row .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
button.link {
  background: var(--chip); color: var(--acc); border: 1px solid #3d5238;
  border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 12px;
}
button.link:hover { border-color: var(--acc); }
.empty { padding: 28px 16px; color: var(--dim); text-align: center; font-size: 13px; }
.more-wrap { padding: 4px 16px 16px; }
.more-wrap button { width: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="view" id="view">
  <div id="hud">Select a category, click an item, then click a grid square.</div>
</div>
<aside>
  <div class="panel-head">
    <h1>Library</h1>
    <p>Pick a category. Click an item, then click a square on the grid to place it.</p>
  </div>
  <div class="filters">
    <label>Dataset
      <select id="dataset"><option value="">All datasets</option></select>
    </label>
    <label>Category
      <select id="category"><option value="">Choose a category</option></select>
    </label>
    <label>Articulation
      <select id="articulation">
        <option value="">Any</option>
        <option value="a">Articulated</option>
        <option value="r">Rigid</option>
      </select>
    </label>
    <label>Search this list
      <input id="q" type="search" placeholder="Filter the loaded category" disabled>
    </label>
  </div>
  <div class="list-bar">
    <span id="status">Choose a category</span>
    <button class="link" id="clear" type="button">Clear scene</button>
  </div>
  <div class="list" id="list">
    <div class="empty" id="empty">Nothing is loaded yet.</div>
  </div>
  <div class="more-wrap">
    <button class="link" id="more" type="button" hidden>Show more</button>
  </div>
</aside>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const CELL = 1;
const SIZE = 24;
const HALF = SIZE / 2;
const PAGE = 40;

const view = document.getElementById("view");
const hud = document.getElementById("hud");
const datasetSel = document.getElementById("dataset");
const categorySel = document.getElementById("category");
const artSel = document.getElementById("articulation");
const search = document.getElementById("q");
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const statusEl = document.getElementById("status");
const moreBtn = document.getElementById("more");

const world = new THREE.Scene();
world.background = new THREE.Color(0xd5dde4);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 200);
camera.position.set(11, 9, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.minDistance = 4;
controls.maxDistance = 40;

world.add(new THREE.HemisphereLight(0xffffff, 0x3c9a46, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.15);
sun.position.set(10, 16, 8);
world.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(SIZE, SIZE),
  new THREE.MeshStandardMaterial({ color: 0x3c9a46, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
world.add(ground);

const grid = new THREE.GridHelper(SIZE, SIZE, 0x145c28, 0x1c6b32);
grid.position.y = 0.012;
world.add(grid);

const highlight = new THREE.Mesh(
  new THREE.PlaneGeometry(CELL * 0.96, CELL * 0.96),
  new THREE.MeshBasicMaterial({ color: 0xfff4b0, transparent: true, opacity: 0.55, depthWrite: false })
);
highlight.rotation.x = -Math.PI / 2;
highlight.position.y = 0.03;
highlight.visible = false;
world.add(highlight);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const placed = [];
let ghost = null;
let armed = null;
let hover = null;

function resize() {
  const w = view.clientWidth;
  const h = view.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
new ResizeObserver(resize).observe(view);
resize();

function faceCamera(group) {
  if (!group) return;
  group.rotation.y = Math.atan2(
    camera.position.x - group.position.x,
    camera.position.z - group.position.z
  );
}

function tick() {
  requestAnimationFrame(tick);
  faceCamera(ghost);
  for (const prop of placed) faceCamera(prop);
  controls.update();
  renderer.render(world, camera);
}
tick();

function snap(point) {
  const limit = HALF - CELL / 2;
  const x = THREE.MathUtils.clamp(Math.floor(point.x / CELL) * CELL + CELL / 2, -limit, limit);
  const z = THREE.MathUtils.clamp(Math.floor(point.z / CELL) * CELL + CELL / 2, -limit, limit);
  return { x, z };
}

function pointerFromEvent(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function groundHit(e) {
  pointerFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ground);
  return hits[0] ? hits[0].point : null;
}

const textures = new Map();
function textureFor(url) {
  if (!textures.has(url)) {
    textures.set(url, new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          if (px[i] > 244 && px[i + 1] > 244 && px[i + 2] > 244) px[i + 3] = 0;
        }
        ctx.putImageData(data, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        resolve(tex);
      };
      img.onerror = () => reject(new Error(url));
      img.src = url;
    }));
  }
  return textures.get(url);
}

async function buildProp(item, isGhost) {
  const tex = await textureFor(item.thumb);
  const aspect = tex.image.width / tex.image.height || 1;
  const h = 0.82;
  const w = Math.min(0.92, h * aspect);
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    side: THREE.DoubleSide,
    opacity: isGhost ? 0.55 : 1,
    depthWrite: !isGhost,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  mesh.position.y = h / 2;
  const group = new THREE.Group();
  group.add(mesh);
  group.userData.itemId = item.id;
  return group;
}

function moveGhost(cell) {
  highlight.visible = true;
  highlight.position.x = cell.x;
  highlight.position.z = cell.z;
  if (ghost) {
    ghost.visible = true;
    ghost.position.x = cell.x;
    ghost.position.z = cell.z;
  }
}

function hideGhost() {
  highlight.visible = false;
  if (ghost) ghost.visible = false;
  hover = null;
}

async function arm(item, row) {
  const same = armed && armed.id === item.id && armed.thumb === item.thumb;
  document.querySelectorAll(".row.selected").forEach(n => n.classList.remove("selected"));
  if (same) {
    armed = null;
    if (ghost) { world.remove(ghost); ghost = null; }
    hideGhost();
    hud.textContent = "Selection cleared. Click an item, then a grid square.";
    return;
  }
  armed = item;
  row.classList.add("selected");
  hud.textContent = `Selected ${item.id}. Click a grid square to place it.`;
  if (ghost) world.remove(ghost);
  ghost = await buildProp(item, true);
  ghost.visible = false;
  world.add(ghost);
  if (hover) moveGhost(hover);
}

async function placeAt(cell) {
  if (!armed) return;
  const item = armed;
  const prop = await buildProp(item, false);
  if (armed !== item) { prop.traverse(o => { if (o.material) o.material.dispose(); }); return; }
  prop.position.set(cell.x, 0, cell.z);
  world.add(prop);
  placed.push(prop);
  hud.textContent = `${placed.length} placed. Click another square, or the item again to deselect.`;
}

let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  down = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!down || e.button !== 0) return;
  const dragged = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5;
  down = null;
  if (dragged || !armed) return;
  const point = groundHit(e);
  if (!point) return;
  placeAt(snap(point));
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!armed) { hideGhost(); return; }
  const point = groundHit(e);
  if (!point) { hideGhost(); return; }
  hover = snap(point);
  moveGhost(hover);
});
renderer.domElement.addEventListener("pointerleave", hideGhost);
renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

document.getElementById("clear").onclick = () => {
  for (const prop of placed) {
    world.remove(prop);
    prop.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  }
  placed.length = 0;
  hud.textContent = armed
    ? `Selected ${armed.id}. Click a grid square to place it.`
    : "Scene cleared. Click an item, then a grid square.";
};

let manifest = null;
let loaded = [];
let shown = 0;
let loadToken = 0;
const shardCache = new Map();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function familyBySlug(slug) {
  return manifest.families.find(f => f.slug === slug) || null;
}
function countFor(fam) {
  const datasets = datasetSel.value ? [datasetSel.value] : Object.keys(fam.counts);
  const kinds = artSel.value === "a" ? [1] : artSel.value === "r" ? [0] : [0, 1];
  let n = 0;
  for (const d of datasets) {
    const pair = fam.counts[d];
    if (!pair) continue;
    for (const k of kinds) n += pair[k] || 0;
  }
  return n;
}
function fillDatasets() {
  const current = datasetSel.value;
  datasetSel.innerHTML = '<option value="">All datasets</option>';
  for (const d of manifest.datasets) datasetSel.add(new Option(d.replace(/^sand3d-/, ""), d));
  if ([...datasetSel.options].some(o => o.value === current)) datasetSel.value = current;
}
function fillCategories() {
  const current = categorySel.value;
  const frag = document.createDocumentFragment();
  frag.appendChild(new Option("Choose a category", ""));
  for (const fam of manifest.families) {
    const n = countFor(fam);
    if (!n) continue;
    frag.appendChild(new Option(`${fam.name} (${n.toLocaleString()})`, fam.slug));
  }
  categorySel.innerHTML = "";
  categorySel.appendChild(frag);
  categorySel.value = [...categorySel.options].some(o => o.value === current) ? current : "";
}
function shardUrls() {
  const fam = familyBySlug(categorySel.value);
  if (!fam) return [];
  const datasets = datasetSel.value ? [datasetSel.value] : Object.keys(fam.counts);
  const kinds = artSel.value ? [artSel.value] : ["r", "a"];
  const urls = [];
  for (const d of datasets) {
    const pair = fam.counts[d];
    if (!pair) continue;
    for (const kind of kinds) {
      const n = kind === "a" ? pair[1] : pair[0];
      if (n > 0) urls.push(`scene/shards/${encodeURIComponent(d)}/${encodeURIComponent(fam.slug)}__${kind}.json`);
    }
  }
  return urls;
}
function fetchShard(url) {
  if (!shardCache.has(url)) {
    shardCache.set(url, fetch(url).then(r => {
      if (!r.ok) throw new Error(r.status + " " + url);
      return r.json();
    }));
  }
  return shardCache.get(url);
}
function visibleItems() {
  const q = search.value.trim().toLowerCase();
  if (!q) return loaded;
  return loaded.filter(it => (it.id || "").toLowerCase().includes(q));
}
function renderList() {
  listEl.querySelectorAll(".row").forEach(n => n.remove());
  if (!categorySel.value) {
    emptyEl.hidden = false;
    emptyEl.textContent = "Nothing is loaded yet.";
    statusEl.textContent = "Choose a category";
    moreBtn.hidden = true;
    search.disabled = true;
    return;
  }
  const items = visibleItems();
  search.disabled = false;
  statusEl.textContent = `${items.length.toLocaleString()} in this category`;
  const slice = items.slice(0, shown);
  emptyEl.hidden = slice.length > 0;
  emptyEl.textContent = items.length ? "" : "No objects match this filter.";
  const frag = document.createDocumentFragment();
  for (const it of slice) {
    const row = document.createElement("div");
    row.className = "row";
    if (armed && armed.id === it.id && armed.thumb === it.thumb) row.classList.add("selected");
    const joints = it.j ? `${it.j} joint${it.j > 1 ? "s" : ""}` : "rigid";
    row.innerHTML = `<img alt="" src="${esc(it.thumb)}">
      <div><div class="name">${esc(it.id)}</div><div class="sub">${joints}</div></div>`;
    row.onclick = () => arm(it, row);
    frag.appendChild(row);
  }
  listEl.appendChild(frag);
  moreBtn.hidden = shown >= items.length;
  moreBtn.textContent = `Show more (${Math.max(0, items.length - shown).toLocaleString()})`;
}
async function reload() {
  const token = ++loadToken;
  loaded = [];
  shown = 0;
  listEl.querySelectorAll(".row").forEach(n => n.remove());
  if (!familyBySlug(categorySel.value)) {
    armed = null;
    if (ghost) { world.remove(ghost); ghost = null; }
    hideGhost();
    renderList();
    hud.textContent = "Select a category, click an item, then click a grid square.";
    return;
  }
  statusEl.textContent = "Loading…";
  emptyEl.hidden = false;
  emptyEl.textContent = "Loading this category…";
  moreBtn.hidden = true;
  try {
    const parts = await Promise.all(shardUrls().map(fetchShard));
    if (token !== loadToken) return;
    loaded = parts.flat();
    shown = Math.min(PAGE, loaded.length);
    if (armed && !loaded.some(it => it.id === armed.id && it.thumb === armed.thumb)) {
      armed = null;
      if (ghost) { world.remove(ghost); ghost = null; }
      hideGhost();
    }
    renderList();
  } catch (err) {
    if (token !== loadToken) return;
    emptyEl.hidden = false;
    emptyEl.textContent = "Could not load this category.";
    statusEl.textContent = "Load failed";
  }
}
function onFilterChange() {
  fillCategories();
  reload();
}
datasetSel.onchange = onFilterChange;
artSel.onchange = onFilterChange;
categorySel.onchange = () => reload();
search.oninput = () => {
  shown = Math.min(PAGE, visibleItems().length);
  renderList();
};
moreBtn.onclick = () => {
  shown = Math.min(shown + PAGE, visibleItems().length);
  renderList();
};

fetch("scene/families.json")
  .then(r => r.json())
  .then(data => {
    manifest = data;
    fillDatasets();
    fillCategories();
    renderList();
  })
  .catch(() => {
    emptyEl.textContent = "Could not load categories. Serve this folder over HTTP.";
  });
</script>
</body>
</html>
