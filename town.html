<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-poly town</title>
<style>
html, body { margin: 0; height: 100%; background: #8fbfeb; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
a.back, #hud {
  position: absolute;
  font: 14px/1.4 "Segoe UI", sans-serif;
  color: #17301c;
  background: rgba(247, 244, 234, 0.92);
  border-radius: 8px;
  text-decoration: none;
}
a.back { top: 14px; left: 14px; padding: 8px 12px; }
#hud { left: 14px; bottom: 14px; padding: 8px 12px; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<a class="back" href="index.html">All scenes</a>
<div id="hud">Drag to look around. Scroll to move closer.</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fbfeb);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6a8f4e, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.35);
sun.position.set(28, 48, 18);
scene.add(sun);

const hud = document.getElementById("hud");
new GLTFLoader().load("town.glb", (gltf) => {
  const root = gltf.scene;
  root.traverse((obj) => {
    if (obj.isMesh) obj.receiveShadow = false;
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.position.set(center.x + size.x * 0.38, center.y + Math.max(size.y, 8) * 3.2, center.z + size.z * 0.38);
  controls.update();
  hud.textContent = "Drag to look around the high street. Scroll to move closer.";
}, undefined, () => {
  hud.textContent = "The town file did not load.";
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
